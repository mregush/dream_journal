name: ${COMPOSE_PROJECT_NAME:-dream-journal}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE in .env.prod}
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 256
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-dream_journal}
      DB_USERNAME: ${DB_USERNAME:-dream_journal}
      DB_PASSWORD: ${DB_PASSWORD:?Set a production DB_PASSWORD in .env.prod}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env.prod}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-dream_journal_agent}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-true}
      DIARY_DEFAULT_TIME_ZONE: ${DIARY_DEFAULT_TIME_ZONE:-Europe/Moscow}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}
      REMINDERS_POLL_INTERVAL_MS: ${REMINDERS_POLL_INTERVAL_MS:-30000}
      APP_KEEP_ALIVE: "true"
      DEPLOYMENT_READINESS_ENABLED: "true"
      DEPLOYMENT_READINESS_FILE: /tmp/dream-journal.ready
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m -XX:+ExitOnOutOfMemoryError"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/dream-journal.ready"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 6
    logging: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 512m
    shm_size: 128m
    environment:
      POSTGRES_DB: ${DB_NAME:-dream_journal}
      POSTGRES_USER: ${DB_USERNAME:-dream_journal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a production DB_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

volumes:
  postgres_data:
