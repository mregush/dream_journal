spring:
  application:
    name: dream-journal
  main:
    web-application-type: none
    keep-alive: ${APP_KEEP_ALIVE:false}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:dream_journal}}
    username: ${DB_USERNAME:dream_journal}
    password: ${DB_PASSWORD:dream_journal_local}
  flyway:
    enabled: true

diary:
  default-time-zone: ${DIARY_DEFAULT_TIME_ZONE:Europe/Moscow}

reminders:
  enabled: ${REMINDERS_ENABLED:true}
  poll-interval-ms: ${REMINDERS_POLL_INTERVAL_MS:30000}

deployment:
  readiness-enabled: ${DEPLOYMENT_READINESS_ENABLED:false}
  readiness-file: ${DEPLOYMENT_READINESS_FILE:/tmp/dream-journal.ready}

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:true}
    username: ${TELEGRAM_BOT_USERNAME:dream_journal_agent}
    token: ${TELEGRAM_BOT_TOKEN:}

# Bot API URLs contain the token. Do not enable HTTP wire logging.
logging:
  level:
    org.telegram.telegrambots: OFF
